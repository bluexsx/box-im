spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/im_platform_open?useSSL=false&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379

storage:
  platform: minio # 存储厂商：minio | aliyun | tencent | huawei | qiniu
  domain: http://192.168.1.109:9000 # 对外访问根地址（拼文件 URL）
  bucket-name: box-im
  image-path: image
  file-path: file
  video-path: video
  expire-in: 180 # 非永久文件过期天数
  access-key: minioadmin
  secret-key: minioadmin
  # MinIO（platform: minio）
  endpoint: http://127.0.0.1:9000 # SDK 内网地址；外网用 domain
  # 阿里云 OSS（platform: aliyun）
  # endpoint: oss-cn-shanghai.aliyuncs.com
  # domain: https://box-im.oss-cn-shanghai.aliyuncs.com  # 或 CDN 域名
  # 腾讯云 COS（platform: tencent）
  # region: ap-guangzhou
  # domain: https://box-im-xxxxx.cos.ap-guangzhou.myqcloud.com  # 或 CDN 域名
  # bucket-name: box-im-xxxxx # 格式一般为 bucket-appid
  # 华为云 OBS（platform: huawei）
  # endpoint: https://obs.cn-north-4.myhuaweicloud.com
  # domain: https://box-im.obs.cn-north-4.myhuaweicloud.com  # 或 CDN 域名
  # 七牛云（platform: qiniu）
  # region: huadong # huadong | huabei | huanan | beimei | xinjiapo | auto
  # domain: https://cdn.yourdomain.com  # 绑定的访问域名（必填，勿用 s3.*.qiniucs.com）
  # bucket-name: box-im

webrtc:
  max-channel: 9 # 多人通话最大通道数量，最大不能超过16,建议值:4,9,16
  iceServers:
    - urls: stun:stun.l.google.com:19302


